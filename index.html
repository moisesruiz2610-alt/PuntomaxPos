
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PuntoMax POS</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f4f9;
      color: #173b70;
    }
    header {
      background: #173b70;
      color: white;
      padding: 25px;
      text-align: center;
    }
    main {
      padding: 25px;
      text-align: center;
    }
    .panel {
      background: white;
      padding: 25px;
      border-radius: 12px;
      max-width: 400px;
      margin: 30px auto;
      box-shadow: 0 3px 12px #0001;
    }
    button {
      background: #173b70;
      color: white;
      border: 0;
      padding: 14px 25px;
      border-radius: 8px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <header>
    <h1>PuntoMax POS</h1>
    <p>Sistema de punto de venta</p>
  </header>
  <main>
    <div class="panel">
      <h2>¡Bienvenido!</h2>
      <p>Tu sistema de ventas está comenzando.</p>
      <button onclick="alert('PuntoMax POS funcionando')">
        Comenzar
      </button>
    </div>
  </main>
</body>
</html>
